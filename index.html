<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>银河牧场 · 放置RPG（云存档版）</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei",sans-serif;background:#141729;color:#e8e8f0;font-size:14px;-webkit-tap-highlight-color:transparent}
#app{max-width:1080px;margin:0 auto;padding:12px}
h1{font-size:18px;padding:8px 0;color:#ffd479}
.spdwrap{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#2a2413;border:1px solid #ffd47955;border-radius:8px;margin-bottom:10px;flex-wrap:wrap}
.spdwrap .lb{color:#ffd479;font-size:14px;font-weight:bold}
.spd{padding:6px 18px;background:#242a45;border:2px solid #3a4166;color:#9ab;border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold;transition:all .15s}
.spd:hover{border-color:#ffd479;color:#ffd479}
.spd.on{background:#ffd479;border-color:#ffd479;color:#141729;box-shadow:0 0 8px #ffd47966}
.statbar{display:flex;gap:12px;padding:8px 10px;background:#1c2036;border-radius:6px;margin-bottom:10px;font-size:12px;flex-wrap:wrap;align-items:center}
.statbar b{color:#ffd479}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{padding:8px 12px;background:#242a45;border:1px solid #3a4166;color:#ccc;cursor:pointer;border-radius:5px 5px 0 0;font-size:13px}
.tabs button.active{background:#3a4166;color:#ffd479}
.panel{background:#222742;border:1px solid #3a4166;border-radius:0 6px 6px 6px;padding:12px;min-height:430px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 10px;background:#242a45;margin-bottom:5px;border-radius:4px;flex-wrap:wrap}
.name{color:#ffd479}
.info{color:#9aa;font-size:12px}
button.act{padding:4px 10px;background:#4a9eff;border:0;color:#fff;border-radius:4px;cursor:pointer;font-size:12px}
button.act:hover{background:#6ab0ff}
button.act:disabled{background:#555;cursor:not-allowed}
button.sm{padding:3px 7px;font-size:11px}
input,select{padding:3px 6px;background:#141729;border:1px solid #3a4166;color:#ffd479;border-radius:4px;font-size:12px}
input[type=number]{width:70px}
.bar{height:16px;background:#332;border-radius:8px;overflow:hidden;margin:4px 0}
.bar>div{height:100%;background:#e55;transition:width .3s}
.bar .xp{background:#5a5}
.deadbar>div{background:#88f}
.timerbar>div{background:#4af}
#log{height:100px;overflow-y:auto;background:#141729;padding:6px;font-size:11px;color:#8f9;border-radius:4px;margin-top:10px}
.hint{font-size:11px;color:#778;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.card{background:#1c2036;border:1px solid #3a4166;border-radius:6px;padding:10px}
.r0{color:#bbb}.r1{color:#6f6}.r2{color:#5af}.r3{color:#c5f}.r4{color:#fa0;text-shadow:0 0 6px #fa06}.r5{color:#f44;text-shadow:0 0 8px #f446}
.zonebar{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.zonebar button{padding:4px 8px;background:#242a45;border:1px solid #3a4166;color:#9ab;border-radius:4px;cursor:pointer;font-size:11px}
.zonebar button.on{background:#3a4166;color:#ffd479}
.zonebar button.hz{border-color:#f805;color:#f80}
.lvbtn{padding:2px 7px;background:#333;border:1px solid #555;color:#ccc;border-radius:3px;cursor:pointer;font-size:11px;margin-left:2px}
.lvbtn.on{background:#4a9eff;border-color:#4a9eff;color:#fff}
.lvbtn.lock{background:#222;color:#555;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:4px 6px;border-bottom:1px solid #2c3152;text-align:left}
.baggrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:8px 0}
.cell{height:46px;background:#1a1d2e;border:1px solid #2c3152;border-radius:4px;position:relative;cursor:pointer;user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cell:hover{border-color:#4a9eff}
.cell.sel{border-color:#ffd479;background:#2a2e45;box-shadow:0 0 4px #ffd47955}
.cell .ic{font-size:20px;line-height:1}
.cell .cnt{font-size:10px;color:#9aa;line-height:1.2}
.cell .idx{position:absolute;top:1px;left:3px;font-size:8px;color:#3d4266}
.pagenav{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.pagenav input{width:70px}
#auth{position:fixed;inset:0;background:rgba(10,12,24,.96);display:flex;align-items:center;justify-content:center;z-index:999}
#auth.hide{display:none}
.authbox{background:#222742;border:1px solid #3a4166;border-radius:10px;padding:28px;width:340px}
.authbox h2{color:#ffd479;font-size:18px;margin-bottom:6px}
.authbox .sub{font-size:12px;color:#889;margin-bottom:14px}
.authbox input{width:100%;margin-bottom:10px;padding:8px;font-size:13px}
.authbox button{width:100%;padding:9px;margin-bottom:8px;font-size:14px}
.authbox .msg{font-size:12px;min-height:16px;margin-bottom:6px}
.authbox .msg.ok{color:#6f6}
.authbox .msg.err{color:#f66}
.aSwitch{display:flex;gap:6px;margin-bottom:14px}
.aSwitch button{flex:1;padding:7px;background:#1a1d2e;border:1px solid #3a4166;color:#9ab;border-radius:5px;cursor:pointer}
.aSwitch button.on{background:#3a4166;color:#ffd479}
label.ck{font-size:12px;color:#9aa;display:flex;gap:6px;align-items:center;margin-bottom:10px;cursor:pointer}
.deadtag{color:#8af;font-weight:bold;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.endless{background:#2a1535;border:1px solid #c5f5}
.laneHead{background:#2a3048;border-left:3px solid #ffd479}
.potGrid{display:flex;gap:5px;margin:4px 0 6px}
.potCell{width:56px;height:56px;background:#1a1d2e;border:1px solid #2c3152;border-radius:5px;cursor:pointer;user-select:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.potCell:hover{border-color:#4a9eff}
.potCell.sel{border-color:#ffd479;background:#2a2e45;box-shadow:0 0 4px #ffd47955}
.potCell .ic{font-size:18px;line-height:1.1}
.potCell .cnt{font-size:9px;color:#9aa;line-height:1.1}
.potCell .cond{font-size:8px;color:#6af;line-height:1.1}
.potCell.empty .ic{opacity:.35}
.potRow{background:#1a2440;border-left:3px solid #49f;padding:4px 8px;gap:4px}
.potRow select{max-width:140px}
.cloudOk{color:#6f6}
.cloudNo{color:#f66}
.modal{position:fixed;inset:0;background:rgba(8,10,20,.78);display:none;align-items:center;justify-content:center;z-index:1000}
.mcard{background:#1c2036;border:1px solid #4a5480;border-radius:12px;padding:20px;width:370px;max-width:92vw;max-height:82vh;overflow-y:auto;box-shadow:0 8px 40px #000a}
.mcard h3{text-align:center;color:#e8e8f0;font-size:17px;margin-bottom:12px}
.offLine{text-align:center;font-size:13px;color:#aab;margin:4px 0}
.offLine b{color:#fff;font-size:14px}
.lvTag{display:inline-block;background:#4a9eff;color:#fff;font-size:11px;padding:1px 8px;border-radius:3px;margin-left:6px;vertical-align:middle}
.offSec{color:#ffd479;font-size:12px;font-weight:bold;margin:10px 0 5px;border-left:3px solid #ffd479;padding-left:6px}
.offGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.offIt{background:#232842;border:1px solid #33395e;border-radius:6px;padding:6px 2px;display:flex;flex-direction:column;align-items:center}
.offIt .ic{font-size:22px;line-height:1.2}
.offIt .ct{font-size:10px;color:#ccd;margin-top:2px}
.mClose{width:100%;padding:9px;margin-top:14px;background:#4a9eff;border:0;color:#fff;border-radius:6px;font-size:14px;cursor:pointer}
.mClose:hover{background:#6ab0ff}
.pickBtn{display:flex;align-items:center;gap:10px;width:100%;padding:12px;margin-bottom:10px;background:#232842;border:1px solid #3a4166;border-radius:8px;cursor:pointer;color:#e8e8f0;font-size:13px;text-align:left}
.pickBtn:hover{border-color:#ffd479;background:#2a3050}
.pickBtn .pic{font-size:26px}
.pickBtn .pt{flex:1}
.pickBtn .pt b{color:#ffd479;display:block;margin-bottom:2px}
.pickBtn .pt span{color:#889;font-size:11px}
.critTxt{color:#f80;font-weight:bold}
.timerTxt{color:#4af;font-weight:bold}
.buffTxt{color:#fa0;font-weight:bold}
.adminTag{background:#f80;color:#141729;font-size:10px;padding:1px 6px;border-radius:3px;font-weight:bold}
.helpSec{background:#1c2036;border:1px solid #3a4166;border-left:3px solid #ffd479;border-radius:6px;padding:10px 14px;margin-bottom:10px}
.helpSec h4{color:#ffd479;font-size:14px;margin-bottom:6px}
.helpSec p{font-size:12px;color:#aab;line-height:1.8;margin:2px 0}
.helpSec p b{color:#e8e8f0}
.helpSec .kw{color:#6f6}
.helpSec .warn{color:#f80}
.cfgRow{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#242a45;margin-bottom:4px;border-radius:4px;flex-wrap:wrap}
.cfgRow .cName{color:#ffd479;min-width:130px;font-size:13px}
.cfgRow .cIn{width:90px}
.cfgRow .cDesc{color:#889;font-size:11px;flex:1;min-width:200px}
.cfgSec{background:#1c2036;border:1px solid #4a5480;border-left:3px solid #ffd479;border-radius:6px;padding:10px 14px;margin-bottom:12px}
.cfgSec h4{color:#ffd479;font-size:14px;margin-bottom:8px}
.cfgHint{font-size:11px;color:#778;margin:4px 0 8px}
.verTag{display:inline-block;background:#4a9eff;color:#fff;font-size:10px;padding:0 6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.balBox{background:#2a2413;border:1px solid #ffd47944;border-radius:6px;padding:8px 12px;margin-top:8px}
.balBox p{font-size:11px;color:#cbb;line-height:1.7;margin:2px 0}
.balBox b{color:#ffd479}
.rebBtn{font-size:16px !important;padding:14px 40px !important;min-height:48px !important;font-weight:bold}

@media (max-width:768px){
  body{font-size:13px}
  #app{padding:8px}
  h1{font-size:15px;padding:6px 0}
  .spdwrap{padding:6px 8px;gap:5px;margin-bottom:8px}
  .spd{padding:6px 12px;font-size:13px}
  .statbar{gap:8px;padding:6px 8px;font-size:11px;margin-bottom:8px}
  .statbar b{font-size:12px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;padding:10px 14px;font-size:13px}
  .panel{padding:8px;min-height:280px}
  .row{padding:7px 8px;gap:5px}
  .info{font-size:11px}
  button.act{padding:8px 12px;font-size:13px;min-height:34px}
  button.act.sm{padding:6px 9px;min-height:28px;font-size:12px}
  input,select{font-size:13px;padding:6px}
  input[type=number]{width:64px}
  #log{height:80px;font-size:11px}
  .hint{font-size:10px}
  .baggrid{grid-template-columns:repeat(6,1fr);gap:3px}
  .cell{height:44px}
  .cell .ic{font-size:18px}
  .grid{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .offGrid{grid-template-columns:repeat(4,1fr)}
  .mcard{width:94vw;padding:14px;max-height:86vh}
  .mcard h3{font-size:15px}
  .authbox{width:92vw;padding:20px}
  .authbox input{padding:10px;font-size:15px}
  .authbox button{padding:11px;font-size:15px}
  .potCell{width:50px;height:50px}
  .potRow select{max-width:110px}
  table{font-size:11px}
  td,th{padding:5px 4px}
  .zonebar button{padding:6px 10px;font-size:11px}
  .lvbtn{padding:5px 9px;font-size:11px}
  .pagenav{gap:4px}
  .pickBtn{padding:14px}
  .mClose{padding:12px;font-size:15px}
  .cfgRow .cName{min-width:110px;font-size:12px}
  .cfgRow .cIn{width:72px}
  .cfgRow .cDesc{min-width:140px}
  .rebBtn{font-size:16px !important;padding:14px 30px !important;width:100%}
}
</style>
</head>
<body>

<div id="auth">
  <div class="authbox">
    <h2>🐄 银河牧场</h2>
    <div class="sub">注册账号：云端同步存档（跨设备）｜游客：仅本机</div>
    <div class="aSwitch">
      <button id="aTabLogin" class="on" onclick="aMode='login';authUI()">登 录</button>
      <button id="aTabReg" onclick="aMode='reg';authUI()">注 册</button>
    </div>
    <input id="aUser" placeholder="用户名（2~16字符）" maxlength="16">
    <input id="aPass" type="password" placeholder="密码（至少6位，云端要求）">
    <label class="ck" style="display:flex">
      <input type="checkbox" id="aRemember" checked>记住账号和密码（打开页面自动填入，点登录即可）
    </label>
    <label class="ck" id="aMigRow" style="display:none">
      <input type="checkbox" id="aMig" checked>继承当前游客进度
    </label>
    <div class="msg" id="aMsg"></div>
    <button class="act" id="aGo" onclick="authGo()">登录</button>
    <button class="act" style="background:#3a4166" onclick="authGuest()">游客试玩</button>
    <div class="hint" id="aCloud"></div>
  </div>
</div>

<div id="app" style="visibility:hidden">
  <h1>🐄 银河牧场 Idle RPG</h1>
  <div class="spdwrap" id="spdwrap"></div>
  <div class="statbar" id="top"></div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
  <div id="log"></div>
</div>

<div class="modal" id="offModal">
  <div class="mcard">
    <h3>欢迎回来！</h3>
    <div id="offBody"></div>
    <button class="mClose" onclick="closeOff()">关闭</button>
  </div>
</div>

<div class="modal" id="savePick">
  <div class="mcard">
    <h3>📂 检测到两份存档，请选择</h3>
    <button class="pickBtn" onclick="chooseSave('cloud')">
      <span class="pic">☁️</span>
      <span class="pt"><b>云存档</b><span id="spCloud"></span></span>
    </button>
    <button class="pickBtn" onclick="chooseSave('local')">
      <span class="pic">💾</span>
      <span class="pt"><b>本地存档</b><span id="spLocal"></span></span>
    </button>
    <div class="hint" style="text-align:center">选择后进入游戏，之后的进度会自动同步到所选存档</div>
  </div>
</div>

<input type="file" id="saveFile" accept=".json,application/json" style="display:none">

<script>
"use strict";
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent)
  || (window.matchMedia && window.matchMedia("(max-width:768px)").matches);

/* ============================================================
   ★ 模块 A：Supabase 云存档 + 全局配置
   ============================================================ */
const SB_URL = "https://scveickilldhyskrndkg.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdmVpY2tpbGxkaHlza3JuZGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NjEyMzQsImV4cCI6MjEwNzUzNzIzNH0.pjqsxqEE5vUcLa_2tkU2V26akUAaQnpwNpITVohvR5w";
const sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SB_URL, SB_KEY) : null;
const CLOUD_ON = () => !!sb;
const sbEmail = (u) => u.toLowerCase() + "@ranch.local";
const FLOOR_LIMIT = 600;
const ADMIN_PREFIX = "qq247084";   /* 用户名前8位 = 管理员 */

function sbErr(e) {
  const msg = (e && (e.message || e.msg)) || String(e);
  log("☁️ 云同步失败：" + msg);
  if (typeof authMsg === "function") authMsg("❌ 云端错误：" + msg, false);
}

async function cloudSignUp(u, p) {
  if (!CLOUD_ON()) { authMsg("❌ Supabase 库未加载（CDN 被墙或断网），请检查网络", false); return false; }
  const { data, error } = await sb.auth.signUp({ email: sbEmail(u), password: p });
  if (error) { sbErr(error); return false; }
  if (data && !data.session && data.user && data.user.identities && data.user.identities.length === 0) {
    authMsg("❌ 该邮箱已被注册（云端已有同名账号），请直接登录", false); return false;
  }
  if (data && !data.session) {
    authMsg("❌ 云端要求邮箱验证：请到 Supabase → Authentication → Email 关闭 Confirm email", false); return false;
  }
  return true;
}

async function cloudSignIn(u, p) {
  if (!CLOUD_ON()) return false;
  const { error } = await sb.auth.signInWithPassword({ email: sbEmail(u), password: p });
  if (error) { sbErr(error); return false; }
  return true;
}

async function cloudSignOut() { if (!CLOUD_ON()) return; try { await sb.auth.signOut(); } catch (e) {} }

async function cloudUid() {
  if (!CLOUD_ON()) return null;
  const { data } = await sb.auth.getSession();
  return (data && data.session && data.session.user) ? data.session.user.id : null;
}

async function cloudSave() {
  if (!CLOUD_ON()) return;
  const id = await cloudUid();
  if (!id) return;
  const raw = localStorage.getItem(saveKeyOf(CUR));
  if (!raw) return;
  const { error } = await sb.from("saves").upsert({ id: id, data: JSON.parse(raw), version: 1 });
  if (error) sbErr(error); else log("☁️ 存档已同步到云端");
}

async function cloudFetch() {
  if (!CLOUD_ON()) return null;
  const id = await cloudUid();
  if (!id) return null;
  const { data, error } = await sb.from("saves").select("data,updated_at").eq("id", id).maybeSingle();
  if (error) { sbErr(error); return null; }
  if (!data || !data.data) return null;
  return data;
}

let PICK = null;
async function enterGameCloud() {
  let cloud = null;
  if (CLOUD_ON()) cloud = await cloudFetch();
  const localRaw = localStorage.getItem(saveKeyOf(CUR));
  if (cloud && localRaw) { pickSave(cloud, localRaw); return; }
  if (cloud) localStorage.setItem(saveKeyOf(CUR), JSON.stringify(cloud.data));
  enterGame();
}
function pickSave(cloud, localRaw) {
  hideAuth();
  PICK = { cloud, localRaw };
  try {
    const ld = JSON.parse(localRaw);
    $("spCloud").textContent = "云端保存时间：" + new Date(cloud.updated_at).toLocaleString();
    $("spLocal").textContent = "本地保存时间：" + new Date(ld.S.lastTick || 0).toLocaleString();
  } catch (e) { $("spCloud").textContent = ""; $("spLocal").textContent = ""; }
  $("savePick").style.display = "flex";
}
function chooseSave(which) {
  $("savePick").style.display = "none";
  if (which === "cloud" && PICK) {
    localStorage.setItem(saveKeyOf(CUR), JSON.stringify(PICK.cloud.data));
    log("☁️ 已选择云存档（覆盖本地）");
  } else {
    log("💾 已选择本地存档");
  }
  PICK = null;
  enterGame();
}

/* ============================================================
   ★ 模块 B：本地账号系统 + 管理员识别
   ============================================================ */
const ACC_KEY = "mr_accounts";
const SES_KEY = "mr_session";
const REM_KEY = "mr_remember";
const GCFG_KEY = "mr_gcfg";
let CUR = null;
let LOGGED_IN = false;
let aMode = "login";
const isAdmin = () => !!CUR && CUR.toLowerCase().slice(0, ADMIN_PREFIX.length) === ADMIN_PREFIX;

function hashPw(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return "h" + h.toString(36) + s.length; }
function accs() { try { return JSON.parse(localStorage.getItem(ACC_KEY) || "{}"); } catch (e) { return {}; } }
function saveAccs(a) { localStorage.setItem(ACC_KEY, JSON.stringify(a)); }
function saveKeyOf(u) { return u === "guest" ? "mr_save_guest" : "mr_save_" + u; }

function saveRemember(u, p) { try { localStorage.setItem(REM_KEY, btoa(encodeURIComponent(JSON.stringify({ u, p })))); } catch (e) {} }
function getRemember() { try { const r = localStorage.getItem(REM_KEY); return r ? JSON.parse(decodeURIComponent(atob(r))) : null; } catch (e) { return null; } }
function clearRemember() { localStorage.removeItem(REM_KEY); }

function showAuth() {
  $("auth").classList.remove("hide");
  $("app").style.visibility = "hidden";
  $("aCloud").innerHTML = CLOUD_ON() ? '<span class="cloudOk">☁️ 云存档已连接</span>' : '<span class="cloudNo">☁️ 云存档未连接（检查网络）</span>';
}
function hideAuth() { $("auth").classList.add("hide"); $("app").style.visibility = "visible"; }
function authUI() {
  $("aTabLogin").className = aMode === "login" ? "on" : "";
  $("aTabReg").className = aMode === "reg" ? "on" : "";
  $("aGo").textContent = aMode === "login" ? "登录" : "注册并进入";
  $("aMigRow").style.display = (aMode === "reg" && localStorage.getItem("mr_save_guest")) ? "flex" : "none";
  $("aMsg").textContent = ""; $("aMsg").className = "msg";
}
function authMsg(t, ok) { const e = $("aMsg"); e.textContent = t; e.className = "msg " + (ok ? "ok" : "err"); }

async function authGo() {
  const u = $("aUser").value.trim();
  const p = $("aPass").value;
  const A = accs();
  if (aMode === "login") {
    const localAcc = A[u];
    if (localAcc && localAcc.ph !== undefined && localAcc.ph !== hashPw(p)) {
      authMsg("❌ 密码错误"); return;
    }
    authMsg("⏳ 正在登录并同步云端存档…", true);
    const ok = await cloudSignIn(u, p);
    doLogin(u);
    if ($("aRemember").checked) saveRemember(u, p); else clearRemember();
    authMsg(ok ? "✅ 登录成功，云端已同步" : "✅ 本地登录成功（云同步未生效）", true);
    setTimeout(ok ? enterGameCloud : enterGame, 300);
  } else {
    if (u.length < 2) { authMsg("❌ 用户名至少2个字符"); return; }
    if (p.length < 6) { authMsg("❌ 密码至少6位（云端账号要求）"); return; }
    if (A[u]) { authMsg("❌ 该用户名已被注册"); return; }
    authMsg("⏳ 正在注册云端账号…", true);
    const ok = await cloudSignUp(u, p);
    if (!ok) {
      const cur = $("aMsg").textContent || "";
      if (!cur || cur.indexOf("⏳") === 0) authMsg("❌ 云端注册失败，请检查网络后重试", false);
      return;
    }
    await cloudSignIn(u, p);
    if ($("aMigRow").style.display !== "none" && $("aMig").checked && localStorage.getItem("mr_save_guest")) {
      localStorage.setItem(saveKeyOf(u), localStorage.getItem("mr_save_guest"));
    }
    A[u] = { ph: hashPw(p), created: Date.now() };
    saveAccs(A);
    doLogin(u);
    if ($("aRemember").checked) saveRemember(u, p); else clearRemember();
    authMsg("✅ 注册成功，已自动登录（云同步开启）", true);
    setTimeout(enterGameCloud, 300);
  }
}

    crit += v.crit||0; critDmg += v.critDmg||0; aspd += v.aspd||0; ls += v.ls||0;

    maxHp:50+lv("hp")*10+hpB, rng:10+lv("rng")*2+atkB,
    eva:(10+defB)*(1+lv("eva")*0.01+evaB*0.005), mag:10+lv("mag")*2+atkB, maxMp:20+lv("mag")*5,

const hitRate = (a,e) => {

    if (lack) {
      if (Date.now()-lastWarn > 3000) { log(`⚠️ [通道${li+1}] 缺少${IT[lack].n}（需要${inp[lack]}），[${a.n}]暂停等待`); lastWarn = Date.now(); }

function mkBuy(id, n) {

function mkSell(id, n) {

let mkTimer = 0, saveT = 0, simAcc = 0, uiT = 0;
function simCore(sec) {
  if (S.teaMin > 0) S.teaMin = Math.max(0, S.teaMin-sec/60);
  if (S.xpMin > 0) S.xpMin = Math.max(0, S.xpMin-sec/60);

  if (S.buffCdMin > 0) S.buffCdMin = Math.max(0, S.buffCdMin-sec/60);

  if (mkTimer > 60) { mkTimer = 0; mkDrift(); }
}
function loop() {
  if (!LOGGED_IN) return;
  const now = Date.now();
  const real = Math.min((now-S.lastTick)/1000, 5);
  S.lastTick = now;
  saveT += real;
  if (saveT > 5) { saveT = 0; saveGame(); }
  simAcc += real*(S.speed||1);
  let iter = 0;
  while (simAcc >= 1 && iter < 120) { simCore(1); simAcc -= 1; iter++; }
  if (iter >= 120) simAcc = 0;
  uiT++;
  if (!IS_MOBILE || uiT >= 3) {
    uiT = 0;
    const ae = document.activeElement;
    const busy = ae && (ae.tagName === "INPUT" || ae.tagName === "SELECT" || ae.tagName === "TEXTAREA");
    renderTop();
    if (!busy) renderPanel();
  }
}

/* ============================================================

   ============================================================ */
function renderPanel() {
  const scr = IS_MOBILE ? $("panel").scrollTop : 0;
  buildTabs();
  if (tab >= TABS.length) tab = TABS.length-1;
  const T_ADMIN = TABS.indexOf("管理员"), T_CFG = TABS.indexOf("数值配置"), T_HELP = TABS.indexOf("帮助");
  $("tabs").innerHTML = TABS.map((t,i)=>`<button class="${i===tab?"active":""}" onclick="tab=${i};renderPanel()">${t}</button>`).join("");
  const el = $("panel");
  let h = "";
  if (tab === 0) {
    checkLanes();
    const tl = totalLv();
    h += `<div class="hint">⚡ 并行通道 <b style="color:#ffd479">${laneCount()}/${LANE_MAX}</b> 条，各通道独立并行执行｜解锁条件（总等级，<b style="color:#6f6">转生不重置</b>）：`
      +[1,2,3,4].map((i)=>` 通道${i+1}→Lv${LANE_LV[i]}${S.lanes[i].open?"✅":"🔒"}`).join("")+`</div>`;
    h += `<div class="row"><select onchange="qSel=this.value;renderPanel()" style="min-width:200px;flex:1">`
      +ACT.map((a)=>`<option value="${a.id}" ${a.id===qSel?"selected":""}>[${SKM[a.sk].n}·需Lv${a.lv}] ${a.n}（${a.t}s，${a.xp}xp）${lv(a.sk)<a.lv?"🔒":""}</option>`).join("")
      +`</select> <input type="number" value="${qNum}" min="1" onchange="qNum=Math.max(1,+this.value|0)">次 `
      +eqCraftUI()
      +` <span class="info">通道</span><select id="qLane">`
      +S.lanes.map((l,i)=>l.open?`<option value="${i}">通道${i+1}</option>`:"").join("")
      +`</select> <button class="act" onclick="addQ()">加入队列</button>`
      +` <button class="act" style="background:#49f" onclick="addQCombat()">⚔️ 战斗×N</button></div>`;
    S.lanes.forEach((lane, li) => {
      if (!lane.open) {
        h += `<div class="row" style="opacity:.55"><span class="name">🔒 通道 ${li+1}</span><span class="info">总等级 ${tl}/${LANE_LV[li]} 解锁（进度 ${Math.min(100,tl/LANE_LV[li]*100|0)}%｜解锁后永久保留，转生不重置）</span></div>`;
        return;
      }
      const head = lane.items[0];
      const ha = head ? ACT.find((x)=>x.id===head.id) : null;
      const headTxt = lane.items.length ? (head.id==="combat"?"⚔️ 战斗进行中":`${ha?ha.n:"?"} 进度 ${Math.min(100,lane.prog/(ha?ha.t:1)*100|0)}%`) : "空闲";
      h += `<div class="row laneHead"><span class="name">▶ 通道 ${li+1}</span><span class="info">${headTxt}｜共 ${lane.items.length} 项</span></div>`;
      lane.items.forEach((q, i) => {
        const a = ACT.find((x)=>x.id===q.id);
        const cur = a ? a.id : "combat";
        const eqInfo = a && a.outEq ? `｜造 ${EQIC[q.slot||"weapon"]} Lv${q.tier||a.lv+10}档` : "";
        h += `<div class="row" style="margin-left:14px;background:#1c2036">`
          +`<span class="name">${i+1}.</span>`
          +`<select onchange="changeQ(${li},${i},this.value)" style="min-width:180px;flex:1">`
          +`<option value="combat" ${cur==="combat"?"selected":""}>⚔️ 战斗${S.endless?"（无尽）":""}</option>`
          +ACT.map((x)=>`<option value="${x.id}" ${cur===x.id?"selected":""}>[${SKM[x.sk].n}] ${x.n}</option>`).join("")
          +`</select><span class="info">剩 ${q.n}${eqInfo}${i===0&&a?`｜效率 ${(S.eff*100)|0}%`:""}</span>`
          +`<button class="act sm" onclick="moveQ(${li},${i},-1)" ${i===0?"disabled":""}>↑</button>`
          +`<button class="act sm" onclick="moveQ(${li},${i},1)" ${i===lane.items.length-1?"disabled":""}>↓</button>`
          +`<button class="act sm" style="background:#e55" onclick="S.lanes[${li}].items.splice(${i},1);renderPanel()">✕</button></div>`;
      });
    });
    if (!S.lanes.some((l)=>l.open&&l.items.length)) h += `<div class="info">所有通道均为空，从上方添加任务开始吧。</div>`;
    h += `<div class="hint">📌 装备制造：全部14档可选（未达技能等级的锁定🔒）｜战斗同一时间只能进行一场；每通道容量 ${QMAX()} 格</div>`;
    h += `<div class="row"><span class="name">条件触发</span><span class="info">HP&lt;</span> <input type="number" value="${S.autoHp}" onchange="S.autoHp=Math.min(90,Math.max(5,+this.value));saveGame()">% 自动吃食物｜MP&lt; <input type="number" value="${S.autoMp}" onchange="S.autoMp=Math.min(90,Math.max(5,+this.value));saveGame()">% 自动喝饮料</div>`;
  }
  else if (tab === 1) {
    h += `<div class="hint">17种技能。总等级 ${totalLv()}｜技能等级上限 ${cfg("skillCap")}（全局设定）｜升级经验曲线：前期快后期慢（受全局升级系数 ×${cfg("xpCf")} 控制）${S.xpMin>0?`｜📖 经验buff +${((S.xpMult||0)*100)|0}%（剩 ${Math.ceil(S.xpMin)} 分钟）`:""}。</div><table><tr><th>技能</th><th>等级</th><th>经验</th><th>进度</th></tr>`;
    SK.forEach((s)=>{ const x = S.skills[s.id]; const maxed = x.lv >= cfg("skillCap");
      h += `<tr><td>${s.ic} ${s.n}<span class="info">（${s.cat}）</span></td><td><b>${x.lv}</b>${maxed?' <span style="color:#fa0;font-size:10px">MAX</span>':""}</td><td class="info">${maxed?"—":`${x.xp|0}/${xpNeed(x.lv)}`}</td><td><div class="bar" style="width:120px"><div class="xp" style="width:${maxed?100:x.xp/xpNeed(x.lv)*100}%"></div></div></td></tr>`; });
    h += `</table>`;
  }
  else if (tab === 2) {
    const AT = S.autoTrash;
    h += `<div class="row" style="background:#1a2440;border:1px solid #4a9eff44">`
      +`<span class="name" style="color:#8af">⚡ 自动处理（掉落即执行）</span>`
      +`<select onchange="setAutoTrash('mode',+this.value)"><option value="0" ${AT.mode===0?"selected":""}>关闭</option><option value="1" ${AT.mode===1?"selected":""}>💰 自动出售</option><option value="2" ${AT.mode===2?"selected":""}>⚒️ 自动分解</option></select>`
      +`<span class="info">品质阈值：</span>`
      +`<select onchange="setAutoTrash('rare',+this.value)"><option value="0" ${AT.rare===0?"selected":""}>普通及以下</option><option value="1" ${AT.rare===1?"selected":""}>精良及以下</option><option value="2" ${AT.rare===2?"selected":""}>闪耀及以下</option></select></div>`;
    h += `<div class="pagenav"><button class="act sm" onclick="gotoPage(bagPage-1)">◀ 上一页</button><span>第 <input type="number" min="1" max="${MAX_PAGES}" value="${bagPage+1}" onchange="gotoPage((+this.value|0)-1)"> / ${MAX_PAGES} 页</span><button class="act sm" onclick="gotoPage(bagPage+1)">下一页 ▶</button><span class="info">已用 ${usedSlots()} 格</span><button class="act sm" onclick="gotoFirstUsed()">跳首件</button><button class="act sm" onclick="gotoFreeSlot()">跳空格</button><button class="act sm" style="background:#a6f" onclick="compactBag()">🧹 整理</button></div>`;
    h += `<div class="baggrid">`;
    for (let c = 0; c < PAGE_SIZE; c++) {
      const k = bagPage+"_"+c; const v = S.slotMap[k];
      if (v == null) h += `<div class="cell" onclick="selSlot='${k}';renderPanel()"></div>`;
      else if (typeof v === "object") {
        const e = v; const rc = RARE_COLOR[e.rare] || "#888";
        h += `<div class="cell ${selSlot===k?"sel":""}" onclick="selSlot='${k}';renderPanel()" title="${e.n} +${e.plus}【${RARE_NAMES[e.rare]}】" style="border-color:${rc}77"><span class="idx">${c+1}</span><span class="ic">${EQIC[e.slot]||"⚔️"}</span><span class="cnt" style="color:${rc}">+${e.plus}${e.ench?"◆"+e.ench:""}</span></div>`;

function setSpd(v) { if (!SPEEDS.includes(v)) return; S.speed = v; saveGame(); renderSpd(); log(`⏩ 游戏速度：${v}×`); }
function setAutoTrash(k, v) { S.autoTrash[k] = v; saveGame(); renderPanel(); log(`⚡ 自动处理：${["关闭","💰自动出售","⚒️自动分解"][S.autoTrash.mode]}｜品质阈值：${RARE_NAMES[S.autoTrash.rare]}及以下`); }
function setPot(i, k, v) { if (!S.pots[i]) S.pots[i] = {id:"",cond:"hp",val:30}; S.pots[i][k] = v; if (k === "cond") S.pots[i].t = null; saveGame(); renderPanel(); }
function pickEndlessFloor(f) {
  if (!S.endless) { log("⚠️ 请先进入无尽模式"); return; }
  f = Math.max(1, Math.min(Math.max(1,S.bestFloor), f|0));
  S.floor = f; S.monHp = endlessMon(S.floor).hp; atkCd = 0; monCd = 1.0;

  log(`🌌 跳转到无尽第 ${S.floor} 层（计时重置）`);
}
function setAutoNext(v) { S.autoNext = !!v; saveGame(); renderPanel(); log(v?"🌌 无尽模式：通关后自动进入下一层":"🌌 无尽模式：通关后停留在本层"); }
function toggleEndless(on) {

  else { S.monHp = mon(S.monI, S.monLv).hp; log(`⏸ 退出无尽模式，回到普通战斗`); }

function drinkItem(id) { if (isDead()) { log("💀 死亡状态无法使用物品"); return; } if (take(id,1)) { S.mp = Math.min(P().maxMp, S.mp+IT[id].mp); log(`喝掉 ${IT[id].n}`); renderPanel(); } }
function equipIt(eqUid) {
  const k = findEqKey(eqUid); if (!k) return;

  if (!canWear(e)) { log(`战斗平均等级需达到 ${Math.min(cfg("skillCap"), e.reqLv)}`); return; }

function sellEq(eqUid) {

function salvageEq(eqUid) {
  const k = findEqKey(eqUid); if (!k) return;
  const e = S.slotMap[k];
  if (e.rare >= 3) {
    const mats = salvageRareMats(e); if (!mats) return;
    if (!confirm(`确认分解 ${eqName(e)}（${RARE_NAMES[e.rare]}）？\n将获得：${matsSummary(mats)}\n（分解系数 ×${rebSalvMult().toFixed(1)}）`)) return;
    delete S.slotMap[k];
    if (selSlot === k) selSlot = null;
    let full = false;
    for (const mk in mats) { if (!addIt(mk, mats[mk])) { full = true; log(`🎒 ${IT[mk].n} 部分未能入包`); } }
    log(`⚒️ 分解 ${RARE_NAMES[e.rare]} ${e.n} → ${matsSummary(mats)}${full?"（背包部分已满）":""}`);
    renderPanel(); return;
  }
  const { mat, n } = salvageGain(e);
  if (e.rare >= 2 && !confirm(`确认分解 ${eqName(e)}（${RARE_NAMES[e.rare]}）？\n将获得 ${IT[mat].ic}${IT[mat].n}×${n} ＋少量金币`)) return;
  delete S.slotMap[k];
  if (addIt(mat, n)) {
    const bonus = Math.floor(sellPriceEq(e)*0.15); S.gold += bonus;
    if (selSlot === k) selSlot = null;
    log(`⚒️ 分解 ${eqName(e)} → ${IT[mat].ic}${IT[mat].n}×${n}${bonus>0?` ＋${bonus}💰`:""}`);
  } else { S.slotMap[k] = e; log("🎒 背包已满，无法分解！"); }
  renderPanel();
}
function batchSellRare(r) {
  const pv = batchPreview((e)=>e.rare===r);
  if (!pv.cnt) { log("没有符合条件的装备"); return; }
  if (!confirm(`确认出售全部【${RARE_NAMES[r]}】装备？\n共 ${pv.cnt} 件，合计 ${pv.gold}💰\n（最高档 Lv${pv.maxTier}）`)) return;
  let g = 0, n = 0;
  bagEquips().forEach(({key,e})=>{ if (e.rare===r && e.rare<3) { g += sellPriceEq(e); delete S.slotMap[key]; if (selSlot===key) selSlot = null; n++; } });
  S.gold += g;

}

  if (!pv.cnt) { log("没有符合条件的装备"); return; }
  const warn = pv.legend ? `\n⚠️ 库存中还有 ${pv.legend} 件高稀有装备不会出售。` : "";
  if (!confirm(`确认出售全部 Lv≤${t} 档装备（传奇以下）？\n共 ${pv.cnt} 件，合计 ${pv.gold}💰${warn}`)) return;
  let g = 0, n = 0;
  bagEquips().forEach(({key,e})=>{ if (e.rare<3 && e.reqLv <= t) { g += sellPriceEq(e); delete S.slotMap[key]; if (selSlot===key) selSlot = null; n++; } });
  S.gold += g;
  log(`💰 批量出售 Lv≤${t} 装备 ×${n}，共得 ${g}💰`); renderPanel();
}
function batchSalvageRare(r) {
  const pv = batchPreview((e)=>e.rare===r);
  if (!pv.cnt) { log("没有符合条件的装备"); return; }
  if (!confirm(`确认分解全部【${RARE_NAMES[r]}】装备？\n共 ${pv.cnt} 件\n产出：${matsSummary(pv.mats)} ＋金币`)) return;
  const mats = {}; let n = 0, g = 0;
  bagEquips().forEach(({key,e})=>{
    if (e.rare===r && e.rare<3) {
      const {mat,mn} = salvageGain(e);
      mats[mat] = (mats[mat]||0)+mn;
      g += Math.floor(sellPriceEq(e)*0.15);
      delete S.slotMap[key];
      if (selSlot===key) selSlot = null;
      n++;
    }
  });
  let full = false;
  for (const k in mats) { if (!addIt(k, mats[k])) { full = true; log(`🎒 ${IT[k].n} 部分未能入包！`); } }
  S.gold += g;
  log(`⚒️ 批量分解 ${RARE_NAMES[r]}装备 ×${n} → ${matsSummary(mats)}${g>0?` ＋${g}💰`:""}${full?"（背包部分已满）":""}`);
  renderPanel();
}
function batchSalvageHigh(r) {
  const list = bagEquips().filter(({e})=>e.rare===r);
  if (!list.length) { log("没有符合条件的装备"); return; }
  let total = {};
  list.forEach(({e})=>{ const m = salvageRareMats(e); for (const k in m) total[k] = (total[k]||0)+m[k]; });
  if (!confirm(`确认分解全部【${RARE_NAMES[r]}】装备 ×${list.length}？\n合计产出：${matsSummary(total)}\n（分解系数 ×${rebSalvMult().toFixed(1)}）`)) return;
  let full = false;
  list.forEach(({key,e})=>{
    const m = salvageRareMats(e);
    delete S.slotMap[key];
    if (selSlot===key) selSlot = null;
    for (const k in m) if (!addIt(k, m[k])) full = true;
  });
  log(`⚒️ 批量分解 ${RARE_NAMES[r]} ×${list.length} → ${matsSummary(total)}${full?"（背包部分已满）":""}`);
  renderPanel();
}
function batchSalvageTier(t) {
  const pv = batchPreview((e)=>e.reqLv <= t);
  if (!pv.cnt) { log("没有符合条件的装备"); return; }
  const warn = pv.legend ? `\n⚠️ 库存中还有 ${pv.legend} 件高稀有装备不会分解。` : "";
  if (!confirm(`确认分解全部 Lv≤${t} 档装备（传奇以下）？\n共 ${pv.cnt} 件\n产出：${matsSummary(pv.mats)} ＋金币${warn}`)) return;
  const mats = {}; let n = 0, g = 0;
  bagEquips().forEach(({key,e})=>{
    if (e.rare<3 && e.reqLv <= t) {
      const {mat,mn} = salvageGain(e);
      mats[mat] = (mats[mat]||0)+mn;
      g += Math.floor(sellPriceEq(e)*0.15);
      delete S.slotMap[key];
      if (selSlot===key) selSlot = null;
      n++;
    }
  });
  let full = false;
  for (const k in mats) { if (!addIt(k, mats[k])) { full = true; log(`🎒 ${IT[k].n} 部分未能入包！`); } }
  S.gold += g;
  log(`⚒️ 批量分解 Lv≤${t} 装备 ×${n} → ${matsSummary(mats)}${g>0?` ＋${g}💰`:""}${full?"（背包部分已满）":""}`);
  renderPanel();
}
function addQ() {
  const laneEl = $("qLane");
  const li = laneEl ? +laneEl.value : 0;
  const lane = S.lanes[li];
  if (!lane || !lane.open) { log("该通道未解锁"); return; }
  if (lane.items.length >= QMAX()) { log(`通道${li+1}已满（每通道 ${QMAX()} 格）`); return; }
  const a = ACT.find((x)=>x.id===qSel);
  if (lv(a.sk) < a.lv) { log(`⚠️ ${SKM[a.sk].n}等级不足`); return; }
  const q = { id:qSel, n:qNum };
  if (a.outEq) {
    const tEl = $("eqTier"); const sEl = $("eqSlot");
    if (tEl) {
      q.tier = +tEl.value;
      if (q.tier > lv(a.sk)) { log(`⚠️ ${SKM[a.sk].n} Lv${lv(a.sk)} 不足以制造 Lv${q.tier} 档`); return; }
    }
    if (sEl) q.slot = sEl.value;
  }
  lane.items.push(q);
  const tag = a.outEq && q.tier ? `（${EQIC[q.slot]} Lv${q.tier}档）` : "";
  log(`➕ [通道${li+1}] ${a.n}${tag}×${qNum}`);
  renderPanel();
}
function addQCombat() {
  if (combatLane()) { log("⚠️ 已有通道正在战斗（同一时间只能有一场战斗）"); return; }
  const laneEl = $("qLane");
  const li = laneEl ? +laneEl.value : 0;
  const lane = S.lanes[li];
  if (!lane || !lane.open) { log("该通道未解锁"); return; }
  if (lane.items.length >= QMAX()) { log(`通道${li+1}已满`); return; }
  lane.items.push({ id:"combat", n:qNum });
  log(`⚔️ [通道${li+1}] 战斗×${qNum}${S.endless?"（无尽）":""}`);
  renderPanel();
}
function changeQ(li, i, id) {
  const lane = S.lanes[li];
  const q = lane.items[i]; if (!q) return;
  if (id === "combat") {
    const c = combatLane();
    if (c && c !== lane) { log("⚠️ 已有其他通道在战斗"); renderPanel(); return; }
    q.id = "combat"; delete q.tier; delete q.slot;
  } else {
    const a = ACT.find((x)=>x.id===id);
    if (lv(a.sk) < a.lv) { log(`⚠️ ${SKM[a.sk].n}等级不足`); renderPanel(); return; }
    q.id = id;
    if (a.outEq) {
      const avail = LV_TIERS.filter((t)=>t <= lv(a.sk));
      q.tier = avail.length ? avail[avail.length-1] : a.lv;
      q.slot = (a.slots || SLOTS.map((s)=>s.id))[0];
    } else { delete q.tier; delete q.slot; }
  }
  renderPanel();
}
function moveQ(li, i, d) { const lane = S.lanes[li]; const q = lane.items.splice(i,1)[0]; lane.items.splice(i+d, 0, q); renderPanel(); }
function pickMon(i, l) { if (S.endless) toggleEndless(false); S.monI = i; S.monLv = l; S.monHp = mon(i,l).hp; renderPanel(); }
function setSkill(id, v) { S.skills[id].lv = Math.min(cfg("skillCap"), Math.max(1, v|0)); S.skills[id].xp = 0; saveGame(); checkLanes(); }
function buyPerk(k, cost) { if (S.bell < cost) return; S.bell -= cost; S.perks[k]++; log("🛒 购买成功"); renderPanel(); }
async function switchAcc(u) {
  const A = accs();
  if (!A[u]) return;
  const pw = prompt(`输入 ${u} 的密码：`);
  if (pw === null) return;
  if (A[u].ph !== hashPw(pw)) { alert("密码错误"); return; }
  saveGame();
  const ok = await cloudSignIn(u, pw);
  doLogin(u);
  if (ok) enterGameCloud(); else enterGame();
}
function delAcc(u) {
  if (!confirm(`确认删除账号 ${u} 及本地存档记录？（云端存档请在 Supabase Dashboard 删除）`)) return;
  const A = accs();
  delete A[u]; saveAccs(A);
  localStorage.removeItem(saveKeyOf(u));
  if (u === CUR) logout(); else renderPanel();
}

/* ============================================================
   ★ 启动
   ============================================================ */
loadCfg();
initAuth();
</script>
