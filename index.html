<div id="auth">

<script>
"use strict";
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent)
  || (window.matchMedia && window.matchMedia("(max-width:768px)").matches);

/* ============================================================
   ★ 模块 A：Supabase 云存档 + 全局配置 + 单点登录 + 回档备份
   ============================================================ */
const SB_URL = "https://scveickilldhyskrndkg.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdmVpY2tpbGxkaHlza3JuZGtnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NjEyMzQsImV4cCI6MjEwNzUzNzIzNH0.pjqsxqEE5vUcLa_2tkU2V26akUAaQnpwNpITVohvR5w";
const sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SB_URL, SB_KEY) : null;
const CLOUD_ON = () => !!sb;
const sbEmail = (u) => u.toLowerCase() + "@ranch.local";
const FLOOR_LIMIT = 600;
const ADMIN_PREFIX = "qq247084";

let SID = null;
async function cloudSetSid() {
  if (!CLOUD_ON()) return;
  const id = await cloudUid();
  if (!id) return;
  SID = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try { await sb.from("logins").upsert({ id: id, sid: SID, updated_at: new Date().toISOString() }); } catch (e) {}
}
async function cloudCheckSid() {
  if (!CLOUD_ON() || !SID || !LOGGED_IN || CUR === "guest") return;
  const id = await cloudUid();
  if (!id) return;
  const { data, error } = await sb.from("logins").select("sid").eq("id", id).maybeSingle();
  if (error || !data) return;
  if (data.sid !== SID) {
    SID = null;
    alert("⚠️ 您的账号已在其他设备登录，本设备已强制下线！");
    logout();
  } else {
    try { await sb.from("logins").update({ updated_at: new Date().toISOString() }).eq("id", id); } catch (e) {}
  }
}
setInterval(cloudCheckSid, 30000);

function sbErr(e) {
  const msg = (e && (e.message || e.msg)) || String(e);
  log("☁️ 云同步失败：" + msg);
  if (typeof authMsg === "function") authMsg("❌ 云端错误：" + msg, false);
}

async function cloudSignUp(u, p) {
  if (!CLOUD_ON()) { authMsg("❌ Supabase 库未加载（CDN 被墙或断网），请检查网络", false); return false; }
  const { data, error } = await sb.auth.signUp({ email: sbEmail(u), password: p });
  if (error) { sbErr(error); return false; }
  if (data && !data.session && data.user && data.user.identities && data.user.identities.length === 0) {
    authMsg("❌ 该邮箱已被注册（云端已有同名账号），请直接登录", false); return false;
  }
  if (data && !data.session) {
    authMsg("❌ 云端要求邮箱验证：请到 Supabase → Authentication → Email 关闭 Confirm email", false); return false;
  }
  return true;
}

async function cloudSignIn(u, p) {
  if (!CLOUD_ON()) return false;
  const { error } = await sb.auth.signInWithPassword({ email: sbEmail(u), password: p });
  if (error) { sbErr(error); return false; }
  await cloudSetSid();
  return true;
}

async function cloudSignOut() { if (!CLOUD_ON()) return; try { await sb.auth.signOut(); } catch (e) {} SID = null; }

async function cloudUid() {
  if (!CLOUD_ON()) return null;
  const { data } = await sb.auth.getSession();
  return (data && data.session && data.session.user) ? data.session.user.id : null;
}

async function cloudSave() {
  if (!CLOUD_ON()) return;
  const id = await cloudUid();
  if (!id) return;
  const raw = localStorage.getItem(saveKeyOf(CUR));
  if (!raw) return;
  const { error } = await sb.from("saves").upsert({ id: id, name: CUR, data: JSON.parse(raw), version: 1 });
  if (error) sbErr(error); else log("☁️ 存档已同步到云端");
  maybeBackup(id);
}
async function maybeBackup(id) {
  try {
    const key = "mr_bk_" + CUR;
    const last = +(localStorage.getItem(key) || 0);
    const now = Date.now();
    if (last !== 0 && now - last < 6*3600*1000) return;
    localStorage.setItem(key, String(now));
    const raw = localStorage.getItem(saveKeyOf(CUR));
    if (!raw) return;

async function authGo() {
  const u = $("aUser").value.trim();
  const p = $("aPass").value;
  const A = accs();
  if (aMode === "login") {
    const localAcc = A[u];
    if (localAcc && localAcc.ph !== undefined && localAcc.ph !== hashPw(p)) {
      authMsg("❌ 密码错误"); return;
    }
    authMsg("⏳ 正在登录并同步云端存档…", true);
    const ok = await cloudSignIn(u, p);
    doLogin(u);
    if ($("aRemember").checked) saveRemember(u, p); else clearRemember();
    authMsg(ok ? "✅ 登录成功，云端已同步（同账号他处登录时本机会掉线）" : "✅ 本地登录成功（云同步未生效）", true);

      return;

      localStorage.setItem(saveKeyOf(u), localStorage.getItem("mr_save_guest"));

    A[u] = { ph: hashPw(p), created: Date.now() };
    saveAccs(A);
    doLogin(u);
    if ($("aRemember").checked) saveRemember(u, p); else clearRemember();
    authMsg("✅ 注册成功，已自动登录（云同步开启）", true);
    setTimeout(enterGameCloud, 300);
  }
}

function eqInp(a, q) {
  const inp = a.inp || {};

  const m = 1+tierIdx(q.tier)*2;

function tickQueue(dt) {

    const inp = eqInp(a, q);

    if (lack) {
      if (Date.now()-lastWarn > 3000) { log(`⚠️ [通道${li+1}] 缺少${IT[lack].n}（需要${inp[lack]}），[${a.n}]暂停等待`); lastWarn = Date.now(); }
      continue;

    while (lane.prog >= need && lane.items.length && lane.items[0] === q) {

function dropRareMat(f) {

function dropZoneGem(i) {
  const z = Math.min(9, (i/10)|0);
  if (z < 5) return;

function rollHighRare(i) {
  const r = Math.random();
  const p5 = i >= 88 ? (i-88)*0.0012 : 0;
  const p4 = i >= 68 ? (i-68)*0.0015 : 0;
  const p3 = i >= 50 ? Math.min(0.25,(i-50)*0.005) : 0;
  if (r < p5) return 5;
  if (r < p5+p4) return 4;
  if (r < p5+p4+p3) return 3;
  return 0;
}
function dropEq(m) {
  const fam = ["iron","steel","bow","staff","leather","robe"][Math.random()*6|0];
  const e = rollEq(fam, m.eqLv, null, m.rb);
  let rr = rollHighRare(m.i < 10000 ? m.i : 99);
  if (S.endless && S.floor >= 1500 && Math.random() < 0.02) {
    const fq = Math.min(11, 6 + Math.floor((S.floor-1500)/400));
    const q = Math.min(fq, maxRare());
    if (q > rr) rr = q;
  }
  rr = Math.min(rr, maxRare());
  if (rr > e.rare) { e.rare = rr; e.n = PREFIX[rr]+e.n.replace(RARE_STRIP,""); rollSpecials(e); }
  const hp = m.hp;
  if (S.endless) e.plus = Math.min(ENH_MAX, Math.floor(hp/8000*Math.random()));
  else e.plus = Math.min(ENH_DROP_CAP, Math.floor(hp/2500*Math.random()));
  addEq(e);
  if (e.rare >= 3) log(`🌟 掉落 ${RARE_NAMES[e.rare]}品质 ${eqName(e)}（+${e.plus}）！`);
}
function killMon(m, q, lane) {
  S.gold += m.gold; q.n--;

  if (st === "melee") { addXp("acc", m.xp*0.5); addXp("pow", m.xp*0.5); }
  if (st === "ranged") { addXp("rng", m.xp); addXp("acc", m.xp*0.15); }
  if (st === "magic") { addXp("mag", m.xp); addXp("acc", m.xp*0.12); }
  ["def","hp","eva"].forEach((k)=>addXp(k, m.xp*0.25));
  if (Math.random() < m.drop) dropEq(m);
  if (!S.endless && Math.random() < 0.05) {
    const n = m.i >= 90 ? 3 : 1;
    if (addIt("yaoDan", n)) log(`🧿 ${m.n} 掉落妖丹×${n}（内丹材料 +${n}经验）`);
  }
  if (S.endless) {
    dropRareMat(S.floor);
    S.floorKills[S.floor] = (S.floorKills[S.floor]||0)+1;
    S.floorStart = Date.now();
    if (S.autoNext !== false) {
      S.floor++;
      if (S.floor > S.bestFloor) { S.bestFloor = S.floor; if (S.bestFloor%100 === 0) log(`🌌 无尽模式：突破第 ${S.bestFloor} 层大关！`); }
    } else {
      if (Date.now()-lastFloorLog > 3000) { log(`🌌 第 ${S.floor} 层通关（累计 ${S.floorKills[S.floor]} 次），停留本层`); lastFloorLog = Date.now(); }
    }
    S.monHp = endlessMon(S.floor).hp;
    if (q.n <= 0) lane.items.shift();
    return;
  }
  dropZoneGem(m.i);
  S.kills[m.i+"-"+m.lv] = (S.kills[m.i+"-"+m.lv]||0)+1;
  S.monHp = mon(S.monI, S.monLv).hp;
  if (q.n <= 0) lane.items.shift();
}

   ★ 模块 N：NPC市场 + ★v1.21 玩家交易市场

const MK = {};
const MK_SPREAD = 0.8;
let mkQty = 1;
function mkSeed() {
  for (const id in IT) {
    if (id === "token") continue;
    if (/^gem_/.test(id)) continue;
    if (BELL_SHOP[id]) continue;
    if (ENDLESS_ONLY[id]) continue;
    MK[id] = { mid:IT[id].val*(0.95+Math.random()*0.1), p0:IT[id].val };
    mkRefresh(id);
  }
}
function mkRefresh(id) {
  const m = MK[id];
  m.sell = []; m.buy = [];
  if (POT_MK[id]) {
    if (Math.random() < 0.3) m.sell.push({ p:POT_MK[id], q:1 });
    m.buy.push({ p:Math.floor(POT_MK[id]*MK_SPREAD), q:1+(Math.random()*2|0) });
    return;
  }
  if (RARE_MATS[id] || id === "punch") {
    const bp = Math.max(2, Math.floor(m.mid*(4+Math.random()*2)));
    m.sell.push({ p:bp, q:1+Math.random()*2|0 });
    m.buy.push({ p:Math.max(1, Math.floor(bp*MK_SPREAD)), q:1+Math.random()*2|0 });
    return;
  }
  const bp = Math.max(1, Math.floor(m.mid));
  for (let i = 0; i < 5; i++) {
    const sp = Math.max(1, Math.floor(bp*(1+i*0.05)));
    m.sell.push({ p:sp, q:3+Math.random()*15|0 });
    m.buy.push({ p:Math.max(1, Math.floor(sp*MK_SPREAD)), q:3+Math.random()*15|0 });
  }
}
function mkDrift() {
  for (const id in MK) {
    const m = MK[id];
    if (POT_MK[id]) { mkRefresh(id); continue; }
    m.mid = Math.max(m.p0*0.6, Math.min(m.p0*1.8, m.mid*(1+(Math.random()-0.5)*0.06)));
    mkRefresh(id);
  }
}
const mkAvail = (id) => MK[id].sell.reduce((a,o)=>a+o.q,0);
function mkBuy(id, n) {
  n = Math.max(1, n|0);
  const m = MK[id];
  const avail = mkAvail(id);
  if (n > avail) { alert(`❌ 市场库存不足！\n\n「${IT[id].n}」当前仅有 ${avail} 个卖单，无法购买 ${n} 个。`); return; }
  let got = 0, cost = 0;
  while (n > 0 && m.sell.length) { const o = m.sell[0]; const t = Math.min(n,o.q); cost += o.p*t; got += t; o.q -= t; n -= t; if (!o.q) m.sell.shift(); }
  if (!got) { alert("市场暂无卖单"); return; }
  if (S.gold < cost) { alert(`❌ 金币不足！\n\n需要 ${cost.toLocaleString()}💰，当前仅有 ${Math.floor(S.gold).toLocaleString()}💰。`); m.sell.unshift({p:Math.floor(cost/got), q:got}); return; }
  S.gold -= cost;
  for (let i = 0; i < got; i++) { if (!addIt(id,1)) { got = i; break; } }
  log(`🛒 买入 ${IT[id].n}×${got}，花 ${cost}💰`);
  renderPanel();
}
function mkSell(id, n) {
  n = Math.max(1, n|0);
  const have = bagN(id);
  if (have <= 0) { alert(`❌ 背包中没有「${IT[id].n}」。`); return; }
  if (n > have) {
    alert(`❌ 背包中仅有 ${have} 个「${IT[id].n}」。\n\n卖出数量已按背包持有量截断为 ${have} 个。`);
    n = have;
  }
  const m = MK[id];
  let rev = 0, got = 0, left = n, lastP = 0, fallback = 0;
  while (left > 0) {
    if (m.buy.length) {
      const o = m.buy[0]; const t = Math.min(left, o.q);
      const gross = o.p*t; const tax = o.p > 49 ? Math.floor(gross*0.02) : 0;
      rev += gross - tax; got += t; o.q -= t; left -= t; lastP = o.p;
      if (!o.q) m.buy.shift();
    } else {
      const p = Math.max(1, Math.floor(lastP || m.mid*MK_SPREAD));
      const t = left;
      const gross = p*t; const tax = p > 49 ? Math.floor(gross*0.02) : 0;
      rev += gross - tax; got += t; fallback += t; left = 0;
    }
  }
  take(id, got); S.gold += rev;
  log(`💰 卖出 ${IT[id].n}×${got}，得 ${rev}💰（已扣税）${fallback ? `｜其中 ${fallback} 个订单不足，按兜底价成交` : ""}`);
  renderPanel();
}

/* 内丹（方案A·万法增幅） */
const ND_PILL_XP = { yaoDan:1, diLingDan:10, tianYuanDan:100 };
const ND_MAX_LV = 100;
function ndXpNeed(n) { return Math.floor(50*Math.pow(1.05,n)); }
function usePill(id, n) {
  if (!ND_PILL_XP[id]) return;
  n = Math.max(1, Math.min(n|0, bagN(id)));
  if (n < 1) { log(`背包中没有${IT[id].n}`); return; }
  const nd = S.neidan;
  if (nd.lv >= ND_MAX_LV) { log(`🧿 内丹已达 Lv${ND_MAX_LV} 满级（全属性+50%）`); return; }
  take(id, n);
  nd.xp += n*ND_PILL_XP[id];
  let ups = 0;
  while (nd.lv < ND_MAX_LV && nd.xp >= ndXpNeed(nd.lv)) { nd.xp -= ndXpNeed(nd.lv); nd.lv++; ups++; }
  if (ups) log(`🧿 内丹升到 Lv${nd.lv}（全属性 +${(nd.lv*0.5).toFixed(1)}%）${ups>1?`（连升${ups}级！）`:""}`);
  else log(`🧿 服用 ${IT[id].ic}${IT[id].n}×${n}（+${n*ND_PILL_XP[id]} 经验，当前 ${nd.xp|0}/${ndXpNeed(nd.lv)}）`);
  saveGame(); renderTop(); renderPanel();
}

function offCap() { return (10+S.perks.off)*3600; }

function fmtDur(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return (h ? h+"h " : "") + ((h||m) ? m+"m " : "") + s + "s";
}
function fmtNum(n) {
  n = Math.floor(n);
  if (n >= 100000) return (n/1000).toFixed(0)+"K";
  if (n >= 10000) return (n/1000).toFixed(1).replace(/\.0$/,"")+"K";
  return n.toLocaleString();
}
function offline() {
  if (!S) return;
  const realEl = Math.max(0, (Date.now()-S.lastTick)/1000);
  const el = Math.min(realEl, offCap());
  if (el < 60) return;
  const goldBefore = S.gold;
  const bagBefore = Object.assign({}, S.bag);
  const eqBefore = bagEquips().length;
  const lvBefore = {}; SK.forEach((s)=>{ lvBefore[s.id] = S.skills[s.id].lv; });
  XP_GAIN = {};
  let left = el, it = 0;
  while (left > 0 && it < 30000) { const dt = Math.min(2,left); simCore(dt); left -= dt; it++; }
  XP_GAIN = null;
  const gain = {}, used = {};
  for (const k in S.bag) { const d = S.bag[k]-(bagBefore[k]||0); if (d > 0) gain[k] = d; }
  for (const k in bagBefore) { const d = (S.bag[k]||0)-bagBefore[k]; if (d < 0) used[k] = -d; }
  const rep = {
    gold: S.gold-goldBefore,
    equips: Math.max(0, bagEquips().length-eqBefore),
    gain, used,
    xp: Object.assign({}, XP_GAIN),
    lvUps: []
  };
  SK.forEach((s)=>{ if (S.skills[s.id].lv > lvBefore[s.id]) rep.lvUps.push({ic:SKM[s.id].ic, n:SKM[s.id].n, lv:S.skills[s.id].lv}); });
  showOfflineModal(realEl, el, rep);
  log(`🌙 离线 ${fmtDur(realEl)}，结算 ${fmtDur(el)}（收益见弹窗）`);
}
function showOfflineModal(realEl, simEl, rep) {
  const card = (ic, txt) => `<div class="offIt"><span class="ic">${ic}</span><span class="ct">${txt}</span></div>`;
  let g = "";
  if (rep.gold > 0) g += card("💰", "+"+fmtNum(rep.gold));
  for (const k in rep.gain) g += card(IT[k]?IT[k].ic:"❓", fmtNum(rep.gain[k]));
  if (rep.equips > 0) g += card("🗡️", "装备×"+rep.equips);
  const x = Object.entries(rep.xp).sort((a,b)=>b[1]-a[1])
    .map(([k,v]) => card(SKM[k].ic, fmtNum(v))).join("");
  let u = "";
  for (const k in rep.used) u += card(IT[k]?IT[k].ic:"❓", fmtNum(rep.used[k]));
  $("offBody").innerHTML =
    `<div class="offLine">离线时间 <b>${fmtDur(realEl)}</b></div>` +
    `<div class="offLine">进展时间 <b>${fmtDur(simEl)}</b>${rep.lvUps.length ? '<span class="lvTag">升级</span>' : ""}</div>` +
    (g ? `<div class="offSec">获得物品</div><div class="offGrid">${g}</div>` : "") +
    (x ? `<div class="offSec">获得经验</div><div class="offGrid">${x}</div>` : "") +
    (u ? `<div class="offSec">消耗物品</div><div class="offGrid">${u}</div>` : "") +
    (rep.lvUps.length ? `<div class="offSec">技能升级</div><div class="offLine" style="color:#6f6">${rep.lvUps.map((l)=>`${l.ic}${l.n}→Lv${l.lv}`).join("　")}</div>` : "");
  $("offModal").style.display = "flex";
}

let mkTimer = 0, saveT = 0, simAcc = 0, uiT = 0, afT = 0;
function simCore(sec) {
  if (S.teaMin > 0) S.teaMin = Math.max(0, S.teaMin-sec/60);
  if (S.xpMin > 0) S.xpMin = Math.max(0, S.xpMin-sec/60);
  if (S.buffHitMin > 0) S.buffHitMin = Math.max(0, S.buffHitMin-sec/60);
  if (S.buffCdMin > 0) S.buffCdMin = Math.max(0, S.buffCdMin-sec/60);
  if (S.buffInvMin > 0) S.buffInvMin = Math.max(0, S.buffInvMin-sec/60);
  tickQueue(sec); tickCombat(sec);
  mkTimer += sec;
  if (mkTimer > 60) { mkTimer = 0; mkDrift(); }
}
function loop() {
  if (!LOGGED_IN) return;
  const now = Date.now();
  const real = Math.min((now-S.lastTick)/1000, 5);
  S.lastTick = now;
  saveT += real;
  if (saveT > 5) { saveT = 0; saveGame(); }
  afT += real;
  if (afT >= 1) { afT = 0; autoForgeTick(); }
  simAcc += real*(S.speed||1);
  let iter = 0;
  while (simAcc >= 1 && iter < 120) { simCore(1); simAcc -= 1; iter++; }
  if (iter >= 120) simAcc = 0;
  uiT++;
  if (!IS_MOBILE || uiT >= 3) {
    uiT = 0;
    const ae = document.activeElement;
    const busy = ae && (ae.tagName === "INPUT" || ae.tagName === "SELECT" || ae.tagName === "TEXTAREA");
    renderTop();
    if (!busy) renderPanel();
    pmAutoRefresh();
  }
}

  const el = $("panel");

    checkLanes();

    h += `<div class="row"><select onchange="qSel=this.value;renderPanel()" style="min-width:200px;flex:1">`
      +ACT.map((a)=>`<option value="${a.id}" ${a.id===qSel?"selected":""}>[${SKM[a.sk].n}·需Lv${a.lv}] ${a.n}（${a.t}s，${a.xp}xp）${lv(a.sk)<a.lv?"🔒":""}</option>`).join("")
      +`</select> <input type="number" value="${qNum}" min="1" onchange="qNum=Math.max(1,+this.value|0)">次 `
      +eqCraftUI()
      +` <span class="info">通道</span><select id="qLane">`

      +` <button class="act" style="background:#49f" onclick="addQCombat()">⚔️ 战斗×N</button></div>`;
    S.lanes.forEach((lane, li) => {
      if (!lane.open) {
        h += `<div class="row" style="opacity:.55"><span class="name">🔒 通道 ${li+1}</span><span class="info">总等级 ${tl}/${LANE_LV[li]} 解锁</span></div>`;

        const eqInfo = a && a.outEq ? `｜造 ${EQIC[q.slot||"weapon"]} Lv${q.tier||a.lv+10}档` : "";

          +`<span class="name">${i+1}.</span>`

      });

  bagEquips().forEach(({key,e})=>{
    if (e.lock || e.rare>=3 || e.reqLv > t) return;
    const {mat,mn} = salvageGain(e);
    mats[mat] = (mats[mat]||0)+mn;
    g += Math.floor(sellPriceEq(e)*0.15);
    if (Array.isArray(e.gems)) e.gems.forEach((g2)=>{ if (g2) addIt(`gem_${g2.t}_${g2.l}`,1); });
    delete S.slotMap[key];
    if (selSlot===key) selSlot = null;
    n++;
  });
  let full = false;
  for (const k in mats) { if (!addIt(k, mats[k])) { full = true; log(`🎒 ${IT[k].n} 部分未能入包！`); } }
  S.gold += g;
  log(`⚒️ 批量分解 Lv≤${t} 装备 ×${n} → ${matsSummary(mats)}${full?"（部分已满）":""}`);
  renderPanel();
}
function addQ() {
  const laneEl = $("qLane");
  const li = laneEl ? +laneEl.value : 0;
  const lane = S.lanes[li];
  if (!lane || !lane.open) { log("该通道未解锁"); return; }
  if (lane.items.length >= QMAX()) { log(`通道${li+1}已满`); return; }
  const a = ACT.find((x)=>x.id===qSel);
  if (lv(a.sk) < a.lv) { log(`⚠️ ${SKM[a.sk].n}等级不足`); return; }
  const q = { id:qSel, n:qNum };
  if (a.outEq) {
    const tEl = $("eqTier"); const sEl = $("eqSlot");
    if (tEl) { q.tier = +tEl.value; if (q.tier > Math.min(lv(a.sk), CRAFT_TIER_CAP)) { log(`⚠️ 不足以制造 Lv${q.tier} 档（制造封顶Lv${CRAFT_TIER_CAP}）`); return; } }
    if (sEl) q.slot = sEl.value;
  }
  lane.items.push(q);
  const tag = a.outEq && q.tier ? `（${EQIC[q.slot]} Lv${q.tier}档）` : "";
  log(`➕ [通道${li+1}] ${a.n}${tag}×${qNum}`);
  renderPanel();
}
function addQCombat() {
  if (combatLane()) { log("⚠️ 已有通道正在战斗"); return; }
  const laneEl = $("qLane");
  const li = laneEl ? +laneEl.value : 0;
  const lane = S.lanes[li];
  if (!lane || !lane.open) { log("该通道未解锁"); return; }
  if (lane.items.length >= QMAX()) { log(`通道${li+1}已满`); return; }
  lane.items.push({ id:"combat", n:qNum });
  log(`⚔️ [通道${li+1}] 战斗×${qNum}${S.endless?"（无尽）":""}`);
  renderPanel();
}
function changeQ(li, i, id) {
  const lane = S.lanes[li];
  const q = lane.items[i]; if (!q) return;
  if (id === "combat") {
    const c = combatLane();
    if (c && c !== lane) { log("⚠️ 已有其他通道在战斗"); renderPanel(); return; }
    q.id = "combat"; delete q.tier; delete q.slot;
  } else {
    const a = ACT.find((x)=>x.id===id);
    if (lv(a.sk) < a.lv) { log(`⚠️ ${SKM[a.sk].n}等级不足`); renderPanel(); return; }
    q.id = id;
    if (a.outEq) {
      const avail = LV_TIERS.filter((t)=>t <= Math.min(lv(a.sk), CRAFT_TIER_CAP));
      q.tier = avail.length ? avail[avail.length-1] : a.lv;
      q.slot = (a.slots || SLOTS.map((s)=>s.id))[0];
    } else { delete q.tier; delete q.slot; }
  }
  renderPanel();
}
function moveQ(li, i, d) { const lane = S.lanes[li]; const q = lane.items.splice(i,1)[0]; lane.items.splice(i+d, 0, q); renderPanel(); }
function pickMon(i, l) { if (S.endless) toggleEndless(false); S.monI = i; S.monLv = l; S.monHp = mon(i,l).hp; renderPanel(); }
function setSkill(id, v) { S.skills[id].lv = Math.min(effCap(), Math.max(1, v|0)); S.skills[id].xp = 0; saveGame(); checkLanes(); }
function buyPerk(k, cost) { if (S.bell < cost) return; S.bell -= cost; S.perks[k]++; log("🛒 购买成功"); renderPanel(); }
async function switchAcc(u) {
  const A = accs();
  if (!A[u]) return;
  const pw = prompt(`输入 ${u} 的密码：`);
  if (pw === null) return;
  if (A[u].ph !== hashPw(pw)) { alert("密码错误"); return; }
  saveGame();
  const ok = await cloudSignIn(u, pw);
  doLogin(u);
  if (ok) enterGameCloud(); else enterGame();
}
function delAcc(u) {
  if (!confirm(`确认删除账号 ${u} 及本地存档记录？`)) return;
  const A = accs();
  delete A[u]; saveAccs(A);
  localStorage.removeItem(saveKeyOf(u));
  if (u === CUR) logout(); else renderPanel();
}

/* ============================================================
   ★ 启动
   ============================================================ */
loadCfg();
initAuth();
</script>
