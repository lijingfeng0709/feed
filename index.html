<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>银河牧场 · 放置RPG（云存档版）</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');}</script>
<script>if(!window.supabase){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/supabase.min.js"><\/script>');}</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="auth">
  <div class="authbox">
    <h2>🐄 银河牧场</h2>
    <div class="sub">注册账号：云端同步存档（跨设备）｜游客：仅本机｜每账号 3 个存档槽</div>
    <div class="aSwitch">
      <button id="aTabLogin" class="on" onclick="aMode='login';authUI()">登 录</button>
      <button id="aTabReg" onclick="aMode='reg';authUI()">注 册</button>
    </div>
    <input id="aUser" placeholder="用户名（2~16字符，登录用）" maxlength="16">
    <input id="aPname" placeholder="玩家名字（2~10字符，全服唯一，排行榜显示）" maxlength="10" style="display:none">
    <input id="aPass" type="password" placeholder="密码（至少6位，云端要求）">
    <label class="ck" style="display:flex">
      <input type="checkbox" id="aRemember" checked>记住账号和密码（打开页面自动填入，点登录即可）
    </label>
    <label class="ck" id="aMigRow" style="display:none">
      <input type="checkbox" id="aMig" checked>继承当前游客进度（放入存档槽1，仅限一次）
    </label>
    <div class="msg" id="aMsg"></div>
    <button class="act" id="aGo" onclick="authGo()">登录</button>
    <button class="act" style="background:#3a4166" onclick="authGuest()">游客试玩</button>
    <div class="hint" id="aCloud"></div>
  </div>
</div>

<div id="app" style="visibility:hidden">
  <h1>🐄 银河牧场 Idle RPG</h1>
  <div class="spdwrap" id="spdwrap"></div>
  <div class="statbar" id="top"></div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
  <div id="log"></div>
</div>

<div class="modal" id="offModal">
  <div class="mcard">
    <h3>欢迎回来！</h3>
    <div id="offBody"></div>
    <button class="mClose" onclick="closeOff()">关闭</button>
  </div>
</div>

<div class="modal" id="slotPick">
  <div class="mcard">
    <h3>📂 选择存档（3 个存档槽）</h3>
    <div id="slotBody"></div>
    <div class="hint" style="text-align:center">本地与云端同时有数据时自动选用较新的一份｜「🗑️ 删除」会同时删除本地和云端该槽存档（不可恢复）｜空槽可开始新存档</div>
  </div>
</div>

<div id="eqMenu" class="ctxMenu" style="display:none"></div>

<input type="file" id="saveFile" accept=".json,application/json" style="display:none">

<!--
  模块索引（原单文件 L268-L3921 按行搬运，业务逻辑零改动）
  加载方式：传统 <script> 顺序加载，所有文件共享同一全局作用域，顺序不可随意调整。
  00-runtime.js       L268-271    严格模式 + 设备判定
  01-cloud.js         L272-556    云存档 / 存档槽 / 单点登录 / 云备份
  02-admin-cloud.js   L557-674    管理员回档 / 充值 / 发放装备
  03-auth.js          L675-863    本地账号 / 管理员识别 / 登录流程
  04-items.js         L864-938    物品注册 + 宝石/药水/材料常量
  05-definitions.js   L939-1078   技能 / 动作 / 装备定义 / 怪物定义
  06-config-state.js  L1079-1200  全局数值配置 + 游戏状态
  07-utils-bag.js     L1201-1308  工具函数 + 背包
  08-equipment.js     L1309-1648  装备系统（生成/强化/宝石/合成）
  09-auto-forge.js    L1649-1744  自动锻造
  10-attributes.js    L1745-1790  属性与命中
  11-queue.js         L1791-1839  并行动作队列
  12-combat.js        L1840-2029  战斗引擎与掉落
  13-npc-market.js    L2030-2117  NPC 市场
  14-player-market.js L2118-2372  玩家交易市场
  15-leaderboard.js   L2373-2425  排行榜
  16-progression.js   L2426-2588  房屋 / 任务 / 转生 / 牛铃商店 / 内丹 / 翅膀
  17-save.js          L2589-2801  存档 / 读档净化 / 离线 / 导入导出
  18-loop.js          L2802-2844  主循环与定时器
  19-ui-common.js     L2845-3027  UI 通用渲染 + 装备右键菜单
  20-ui-help.js       L3028-3116  帮助页
  21-ui-panel.js      L3117-3639  面板渲染 renderPanel / render
  22-interactions.js  L3640-3916  页面交互函数（onclick 入口）
  99-boot.js          L3917-3921  启动：loadCfg() + initAuth()
  维护提示：新增函数放入对应模块；顶层立即执行的常量（如 POT_ITEMS）必须排在被引用模块之后。
-->
<script src="js/00-runtime.js"></script>
<script src="js/01-cloud.js"></script>
<script src="js/02-admin-cloud.js"></script>
<script src="js/03-auth.js"></script>
<script src="js/04-items.js"></script>
<script src="js/05-definitions.js"></script>
<script src="js/06-config-state.js"></script>
<script src="js/07-utils-bag.js"></script>
<script src="js/08-equipment.js"></script>
<script src="js/09-auto-forge.js"></script>
<script src="js/10-attributes.js"></script>
<script src="js/11-queue.js"></script>
<script src="js/12-combat.js"></script>
<script src="js/13-npc-market.js"></script>
<script src="js/14-player-market.js"></script>
<script src="js/15-leaderboard.js"></script>
<script src="js/16-progression.js"></script>
<script src="js/17-save.js"></script>
<script src="js/18-loop.js"></script>
<script src="js/19-ui-common.js"></script>
<script src="js/20-ui-help.js"></script>
<script src="js/21-ui-panel.js"></script>
<script src="js/22-interactions.js"></script>
<script src="js/99-boot.js"></script>
</body>
</html>
